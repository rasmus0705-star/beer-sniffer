:root{--bg:#08070a;--surface:#100d11;--surface2:#16121a;--border:rgba(217,162,51,.18);--border-l:rgba(217,162,51,.34);--text:#f0e8d8;--muted:#cfc6b6;--dim:#b3a898;--gold:#d9a233;--gold-l:#f0c35e;--green:#7cc79a;--serif:'Playfair Display',Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit}
.bar{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.7rem 1.4rem;border-bottom:1px solid var(--border);background:rgba(8,7,10,.9);position:sticky;top:0;z-index:5;backdrop-filter:blur(10px)}
.word{font-family:var(--serif);letter-spacing:.3em;text-transform:uppercase;color:var(--gold-l);font-size:.95rem;text-decoration:none}
.priv{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
main{max-width:1000px;margin:0 auto;padding:1.6rem 1.2rem 3rem}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:.3rem}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:1.1rem}
.tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.tab{background:transparent;border:1px solid var(--border-l);color:var(--muted);padding:.6rem 1rem;border-radius:2px;font:inherit;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.tab b{color:var(--gold-l);margin-left:.4rem}
.tab.on{border-color:var(--gold);color:var(--gold-l);background:rgba(217,162,51,.08)}
.ctrl{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:.9rem}
.ctrl input[type=search],.ctrl select{background:var(--surface);border:1px solid var(--border-l);color:var(--text);padding:.55rem .7rem;border-radius:2px;font:inherit;font-size:.85rem}
.ctrl input[type=search]{flex:1 1 200px;min-width:160px}
.ctrl label{display:flex;gap:.4rem;align-items:center;color:var(--muted);font-size:.85rem;cursor:pointer}
.sum{color:var(--muted);font-size:.85rem;margin:.2rem 0 .8rem}
.sum b{color:var(--gold-l);font-weight:600}
.row{display:grid;grid-template-columns:1fr auto;gap:.5rem 1rem;padding:.85rem 1rem;background:var(--surface);border:1px solid var(--border);border-radius:3px;margin-bottom:.5rem}
.row:hover{border-color:var(--gold)}
.name{font-family:var(--serif);font-weight:500;font-size:1.05rem;text-decoration:none}
.name:hover{color:var(--gold-l)}
.meta{color:var(--dim);font-size:.8rem;margin-top:.1rem}
.shop{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-l);margin-bottom:.15rem}
.right{text-align:right}
.price{white-space:nowrap}
.price s{color:var(--dim);margin-right:.35rem;text-decoration-color:#d7cfc0}
.price b{font-family:var(--serif);font-size:1.25rem;font-weight:500;color:var(--gold-l)}
.delta{color:var(--green);font-weight:600;font-size:.85rem}
.tags{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;margin-top:.35rem}
.tag{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;padding:.15rem .45rem;border:1px solid var(--border-l);border-radius:2px;color:var(--gold-l)}
.tag.g{border-color:rgba(124,199,154,.5);color:var(--green)}
.buy{display:inline-block;margin-top:.45rem;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--gold);color:var(--gold-l);padding:.3rem .7rem;border-radius:2px;text-decoration:none}
.buy:hover{background:var(--gold);color:#0a0806}
.tom{padding:2rem 1rem;text-align:center;color:var(--muted);border:1px dashed var(--border-l);border-radius:3px}
.foot{margin-top:2rem;color:var(--dim);font-size:.75rem;border-top:1px solid var(--border);padding-top:.9rem}
@media(max-width:560px){main{padding:1.1rem .8rem 2.5rem}.row{grid-template-columns:1fr}.right{text-align:left}.tab{flex:1}}
</style>

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function build() {
  $('sub').textContent = DATA.info.foerste
    ? 'Første kørsel er gemt. Prisfald vises fra næste kørsel.'
    : 'Opdateret ' + DATA.info.nu + '. Sammenlignet med kørslen ' + (tab === 'igaar' ? DATA.info.igaar_ts + ' (seneste før i dag)' : DATA.info.sidste_ts + ' (forrige kørsel)') + '.';
  const tabs = $('tabs'); tabs.textContent = '';
  [['sidste', 'Siden sidste kørsel'], ['igaar', 'Siden i går']].forEach(([k, label]) => {
    const b = el('button', 'tab' + (tab === k ? ' on' : ''), label); b.type = 'button';
    b.appendChild(el('b', '', String(lists[k].length)));
    b.onclick = () => { tab = k; build(); render(); };
    tabs.appendChild(b);
  });
  const shops = [...new Set(lists.sidste.concat(lists.igaar).map(r => r.sh))].sort((a, b) => a.localeCompare(b, 'da'));
  const sel = $('shop'), cur = sel.value; sel.length = 1;
  shops.forEach(s => { const o = el('option', '', s); o.value = s; sel.appendChild(o); });
  sel.value = shops.includes(cur) ? cur : '';
  $('foot').textContent = 'Siden er ikke linket fra BeerSniffer, står ikke i sitemap og er markeret noindex. Et fald tæller fra mindst 2 % og 1 kr. Køb-knapper åbner butikkens egen side.';
}
function render() {
  const q = $('q').value.trim().toLowerCase(), shop = $('shop').value, minpct = +$('minpct').value, cheap = $('cheap').checked, sort = $('sort').value;
  let rows = lists[tab].filter(r => (!shop || r.sh === shop) && r.pc >= minpct && (!cheap || r.m) &&
    (!q || (r.n + ' ' + r.b + ' ' + r.sh + ' ' + r.t).toLowerCase().includes(q)));
  const cmp = {pc: (a, b) => b.pc - a.pc, d: (a, b) => b.d - a.d, p: (a, b) => a.p - b.p, sh: (a, b) => a.sh.localeCompare(b.sh, 'da') || b.pc - a.pc, n: (a, b) => a.n.localeCompare(b.n, 'da')}[sort];
  rows.sort(cmp);
  const list = $('list'); list.textContent = '';
  const beers = new Set(rows.map(r => r.s)).size, nshops = new Set(rows.map(r => r.sh)).size;
  const sum = $('sum'); sum.textContent = '';
  if (rows.length) {
    const top = rows.slice().sort((a, b) => b.pc - a.pc)[0];
    sum.append(el('b', '', rows.length + ' prisfald'), ' på ' + beers + ' øl i ' + nshops + ' butikker. Største fald: ' + top.n + ' (' + top.sh + ', −' + top.pc.toString().replace('.', ',') + ' %).');
  }
  if (!rows.length) {
    list.appendChild(el('div', 'tom', DATA.info.foerste ? 'Ingen sammenligning endnu. Kør opdateringen igen, så vises prisfald her.' : (lists[tab].length ? 'Ingen prisfald matcher dine filtre.' : 'Ingen øl er faldet i pris siden ' + (tab === 'igaar' ? 'i går' : 'sidste kørsel') + '.')));
    return;
  }
  const frag = document.createDocumentFragment();
  rows.forEach(r => {
    const row = el('div', 'row'), left = el('div'), right = el('div', 'right');
    const a = el('a', 'name', r.n); a.href = 'ol/' + encodeURIComponent(r.s) + '/'; left.appendChild(a);
    left.appendChild(el('div', 'meta', [r.b, r.t, r.c ? r.c + ' cl' : ''].filter(Boolean).join(' · ')));
    const tags = el('div', 'tags');
    if (r.m) tags.appendChild(el('span', 'tag g', 'Billigst nu'));
    if (r.nm) tags.appendChild(el('span', 'tag', 'Ny laveste pris'));
    if (tags.childNodes.length) left.appendChild(tags);
    right.appendChild(el('div', 'shop', r.sh));
    const price = el('div', 'price'); price.appendChild(el('s', '', fmt(r.o))); price.appendChild(el('b', '', fmt(r.p))); right.appendChild(price);
    right.appendChild(el('div', 'delta', '−' + fmt(r.d) + ' (−' + r.pc.toString().replace('.', ',') + ' %)'));
    if (r.u) { const buy = el('a', 'buy', 'Køb →'); buy.href = r.u; buy.target = '_blank'; buy.rel = 'sponsored noopener nofollow'; right.appendChild(buy); }
    row.appendChild(left); row.appendChild(right); frag.appendChild(row);
  });
  list.appendChild(frag);
}
['q', 'shop', 'minpct', 'sort', 'cheap'].forEach(id => $(id).addEventListener(id === 'q' ? 'input' : 'change', render));
build(); render();
</script>
</body>
</html>
