<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Side ikke fundet | BeerSniffer</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://beersniffer.dk/">
<link rel="icon" href="/favicon.ico">
<style>
:root{--bg:#0f0d0a;--text:#f0e9df;--gold:#c8920e;--gold-light:#e0b53a;--muted:#9a8f80}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem}
.wrap{max-width:480px}
.logo{height:48px;margin-bottom:1.5rem}
h1{font-size:2rem;color:var(--gold);margin-bottom:.5rem}
p{color:var(--muted);margin-bottom:1.5rem;line-height:1.6}
a{display:inline-block;background:var(--gold);color:var(--bg);padding:.7rem 1.5rem;border-radius:8px;text-decoration:none;font-weight:600}
a:hover{background:var(--gold-light)}
</style>
</head>
<body>
<div class="wrap">
<img src="/logo.png" alt="BeerSniffer" class="logo">
<h1>404</h1>
<p>Siden du leder efter er flyttet eller findes ikke.</p>
<a href="/">Tilbage til forsiden</a>
</div>
</body>
</html>
